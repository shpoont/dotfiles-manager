name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.22"

jobs:
  preflight:
    name: preflight-gates
    runs-on: ubuntu-latest
    outputs:
      has_go_mod: ${{ steps.detect-go.outputs.has_go_mod }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Detect Go module
        id: detect-go
        run: |
          echo "has_go_mod=$(bash scripts/ci/check-go-module.sh)" >> "$GITHUB_OUTPUT"

      - name: Install linters
        if: steps.detect-go.outputs.has_go_mod == 'true'
        run: bash scripts/ci/install-linters.sh

      - name: Run static checks
        run: bash scripts/ci/run-static-checks.sh "${{ steps.detect-go.outputs.has_go_mod }}"

      - name: Run linux shard (unit)
        if: steps.detect-go.outputs.has_go_mod == 'true'
        run: bash scripts/ci/docker-shard.sh unit "${{ steps.detect-go.outputs.has_go_mod }}"

      - name: Run linux shard (integration)
        if: steps.detect-go.outputs.has_go_mod == 'true'
        run: bash scripts/ci/docker-shard.sh integration "${{ steps.detect-go.outputs.has_go_mod }}"

      - name: Run linux shard (contract)
        if: steps.detect-go.outputs.has_go_mod == 'true'
        run: bash scripts/ci/docker-shard.sh contract "${{ steps.detect-go.outputs.has_go_mod }}"

      - name: Run linux shard (performance)
        if: steps.detect-go.outputs.has_go_mod == 'true'
        run: bash scripts/ci/docker-shard.sh performance "${{ steps.detect-go.outputs.has_go_mod }}"

      - name: Aggregate coverage gates
        if: steps.detect-go.outputs.has_go_mod == 'true'
        run: |
          bash scripts/ci/coverage-aggregate.sh \
            artifacts/coverage-unit.out \
            artifacts/coverage-integration.out \
            artifacts/coverage-contract.out \
            artifacts/branch-metrics.json

  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    needs:
      - preflight
    # Configure environment protection rules in GitHub settings to enforce
    # required reviewer(s) for release approval.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Validate release ref
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "::error::The release workflow may publish only from a tag ref. Select a v* tag when using workflow_dispatch."
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != v* ]]; then
            echo "::error::Release tag must start with 'v'. Got: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Guard release prerequisites
        id: guard
        run: |
          echo "should_run=$(bash scripts/ci/guard-release.sh)" >> "$GITHUB_OUTPUT"

      - name: Skip release (bootstrap mode)
        if: steps.guard.outputs.should_run != 'true'
        run: |
          echo "Skipping GoReleaser because go.mod and/or .goreleaser.yml is missing."

      - name: Build release artifacts for metadata gate
        if: steps.guard.outputs.should_run == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release archive version metadata before publish
        if: steps.guard.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          channel="stable"
          if [[ "${version}" == *-* ]]; then
            channel="prerelease"
          fi

          bash scripts/ci/check-goreleaser-archive-version-metadata.sh dist \
            --expected-version "${version}" \
            --expected-channel "${channel}" \
            --expected-provenance goreleaser

      - name: Run GoReleaser
        if: steps.guard.outputs.should_run == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dispatch_homebrew_tap:
    name: dispatch homebrew tap
    runs-on: ubuntu-latest
    needs:
      - goreleaser
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.goreleaser.result == 'success'
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Validate tag
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TAG:-}" ]]; then
            echo "::error::Missing release tag."
            exit 1
          fi
          if [[ "${RELEASE_TAG}" != v* ]]; then
            echo "::error::Tag must start with 'v'. Got: ${RELEASE_TAG}"
            exit 1
          fi

      - name: Compute source checksum
        id: source
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          commit_date="$(git show -s --format=%cI "${commit}")"
          build_date="$(date -u -d "${commit_date}" '+%Y-%m-%dT%H:%M:%SZ')"
          channel="stable"
          if [[ "${version}" == *-* ]]; then
            channel="prerelease"
          fi

          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${RELEASE_TAG}.tar.gz" -o source.tar.gz
          sha256="$(sha256sum source.tar.gz | awk '{print $1}')"

          if [[ ! "${sha256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Computed SHA256 is invalid: ${sha256}"
            exit 1
          fi
          if [[ ! "${commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Resolved release commit is invalid: ${commit}"
            exit 1
          fi
          if [[ ! "${build_date}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            echo "::error::Resolved release date is invalid: ${build_date}"
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "date=${build_date}" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Ensure dispatch token exists
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${TAP_TOKEN:-}" ]]; then
            echo "::error::Missing secret HOMEBREW_TAP_DISPATCH_TOKEN."
            echo "::error::Create a classic/fine-grained PAT with access to shpoont/homebrew-tap and store it in this repo."
            exit 1
          fi

      - name: Dispatch bottle workflow in homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
          VERSION: ${{ steps.source.outputs.version }}
          SHA256: ${{ steps.source.outputs.sha256 }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          SOURCE_DATE: ${{ steps.source.outputs.date }}
          CHANNEL: ${{ steps.source.outputs.channel }}
          PROVENANCE: homebrew-source
        run: |
          set -euo pipefail
          gh api repos/shpoont/homebrew-tap/dispatches \
            --method POST \
            --input - <<JSON
          {
            "event_type": "dotfiles-manager-release",
            "client_payload": {
              "tag": "${RELEASE_TAG}",
              "version": "${VERSION}",
              "source_sha256": "${SHA256}",
              "source_commit": "${SOURCE_COMMIT}",
              "source_date": "${SOURCE_DATE}",
              "channel": "${CHANNEL}",
              "provenance": "${PROVENANCE}"
            }
          }
          JSON
