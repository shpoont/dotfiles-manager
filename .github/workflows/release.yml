name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.22"

jobs:
  preflight:
    name: preflight-gates
    runs-on: ubuntu-latest
    outputs:
      has_go_mod: ${{ steps.detect-go.outputs.has_go_mod }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Detect Go module
        id: detect-go
        run: |
          echo "has_go_mod=$(bash scripts/ci/check-go-module.sh)" >> "$GITHUB_OUTPUT"

      - name: Install linters
        if: steps.detect-go.outputs.has_go_mod == 'true'
        run: bash scripts/ci/install-linters.sh

      - name: Run static checks
        run: bash scripts/ci/run-static-checks.sh "${{ steps.detect-go.outputs.has_go_mod }}"

      - name: Run linux shard (unit)
        if: steps.detect-go.outputs.has_go_mod == 'true'
        run: bash scripts/ci/docker-shard.sh unit "${{ steps.detect-go.outputs.has_go_mod }}"

      - name: Run linux shard (integration)
        if: steps.detect-go.outputs.has_go_mod == 'true'
        run: bash scripts/ci/docker-shard.sh integration "${{ steps.detect-go.outputs.has_go_mod }}"

      - name: Run linux shard (contract)
        if: steps.detect-go.outputs.has_go_mod == 'true'
        run: bash scripts/ci/docker-shard.sh contract "${{ steps.detect-go.outputs.has_go_mod }}"

      - name: Run linux shard (performance)
        if: steps.detect-go.outputs.has_go_mod == 'true'
        run: bash scripts/ci/docker-shard.sh performance "${{ steps.detect-go.outputs.has_go_mod }}"

      - name: Aggregate coverage gates
        if: steps.detect-go.outputs.has_go_mod == 'true'
        run: |
          bash scripts/ci/coverage-aggregate.sh \
            artifacts/coverage-unit.out \
            artifacts/coverage-integration.out \
            artifacts/coverage-contract.out \
            artifacts/branch-metrics.json

  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    needs:
      - preflight
    # Configure environment protection rules in GitHub settings to enforce
    # required reviewer(s) for release approval.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Guard release prerequisites
        id: guard
        run: |
          echo "should_run=$(bash scripts/ci/guard-release.sh)" >> "$GITHUB_OUTPUT"

      - name: Skip release (bootstrap mode)
        if: steps.guard.outputs.should_run != 'true'
        run: |
          echo "Skipping GoReleaser because go.mod and/or .goreleaser.yml is missing."

      - name: Run GoReleaser
        if: steps.guard.outputs.should_run == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
